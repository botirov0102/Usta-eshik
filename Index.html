<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eshik Ustasi — Badiiy metall eshiklar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f0d0a; --line:#292217;
    --bronze:#c9974f; --bronze-hi:#ecd0a0; --bronze-dim:#8a6c3c;
    --cream:#ede4d3; --muted:#9a8d79;
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:'Manrope',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100svh; background:var(--bg); color:var(--cream);
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    overflow-x:hidden;
  }
  /* nozik romb-panjara teksturasi */
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none;
    background-image:
      linear-gradient(45deg, var(--line) 1px, transparent 1px),
      linear-gradient(-45deg, var(--line) 1px, transparent 1px);
    background-size:46px 46px; opacity:.45;
  }
  ::selection{background:var(--bronze); color:#171106}
  a{color:inherit; text-decoration:none}

  .card{
    position:relative; z-index:1; text-align:center;
    padding:40px clamp(20px,6vw,60px);
    display:flex; flex-direction:column; align-items:center;
  }

  /* ── LOGO: eshik, ustiga borsangiz ochiladi ── */
  .door{width:min(240px,56vw); position:relative; cursor:pointer}
  .door .halo{
    position:absolute; inset:-80px; pointer-events:none; opacity:0;
    transition:opacity 1.1s ease .15s;
    background:radial-gradient(closest-side, rgba(233,201,141,.16), transparent 70%);
  }
  .door:hover .halo{opacity:1}
  .door svg{display:block; width:100%; height:auto; overflow:visible}
  .door .swing{
    transform-box:fill-box; transform-origin:0 50%;
    transition:transform 1.35s cubic-bezier(.3,1,.35,1);
  }
  .door:hover .swing{transform:perspective(1150px) rotateY(-33deg)}
  .door .inner-glow{opacity:0; transition:opacity 1s ease .18s}
  .door:hover .inner-glow{opacity:1}

  h1{
    font:600 clamp(34px,6.5vw,58px)/1.1 var(--serif);
    letter-spacing:.14em; text-transform:uppercase;
    margin-top:34px;
  }
  .sub{
    display:flex; align-items:center; gap:16px; margin-top:12px;
    font:italic 500 clamp(15px,2vw,19px) var(--serif); color:var(--muted);
  }
  .sub::before,.sub::after{content:''; width:42px; height:1px; background:var(--line)}

  /* ── KONTAKTLAR ── */
  .links{display:flex; flex-direction:column; gap:16px; margin-top:48px; width:min(340px,100%)}
  .chip{
    display:flex; align-items:center; gap:16px; padding:16px 22px; text-align:left;
    border:1px solid var(--line); background:rgba(20,16,11,.55);
    transition:.35s;
  }
  .chip-ic{
    width:42px; height:42px; flex:none; border:1px solid var(--line);
    border-radius:50%; display:grid; place-items:center;
    color:var(--muted); transition:.35s;
  }
  .chip-ic svg{width:18px; height:18px}
  .chip-tx small{
    display:block; font-size:10px; letter-spacing:.3em; text-transform:uppercase;
    color:var(--muted); margin-bottom:3px;
  }
  .chip-tx b{font-size:16.5px; font-weight:600}
  .chip-arr{margin-left:auto; color:var(--muted); transition:.35s}
  .chip-arr svg{width:15px; height:15px; display:block}
  .chip:hover{border-color:var(--bronze); transform:translateY(-3px); background:rgba(26,20,13,.75)}
  .chip:hover .chip-ic{color:var(--bronze); border-color:var(--bronze-dim)}
  .chip:hover .chip-arr{color:var(--bronze); transform:translateX(4px)}

  @media (max-width:420px){
    .chip-arr{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
  }
</style>
</head>
